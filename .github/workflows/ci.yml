name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Public-data audit
        run: scripts/public-audit
      - name: Local product scope
        run: scripts/test-local-scope
      - name: Shell syntax
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts apps -type f \( -name '*.sh' -o -name 'brain' \) -print0)

  mac-app:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Swift release build
        run: swift build --package-path apps/brain-menu --configuration release
      - name: Bundle input checks
        run: |
          plutil -lint apps/brain-menu/Resources/Info.plist
          plutil -lint apps/brain-menu/Resources/VoxTypeInfo.plist
          test -s apps/brain-menu/Resources/Brain.icns
          test -s apps/brain-menu/Resources/VoxType-LICENSE.txt
          bash -n apps/brain-menu/install.sh
          bash -n apps/brain-menu/package.sh
          bash -n apps/brain-menu/fetch-voxtype.sh
          bash -n apps/brain-menu/fetch-speaker-encoder.sh
          apps/brain-menu/fetch-voxtype.sh "$RUNNER_TEMP/voxtype"
          test "$("$RUNNER_TEMP/voxtype" --version)" = "voxtype 0.7.5"
      - name: Swift tests
        run: swift test --package-path apps/brain-menu --no-parallel
