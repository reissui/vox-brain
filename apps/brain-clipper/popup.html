<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Save to Brain</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <span class="mark" aria-hidden="true">B</span>
        <div>
          <h1>Save to Brain</h1>
          <p id="pageTitle">Current page</p>
        </div>
      </header>
      <form id="captureForm">
        <label for="type">Save as</label>
        <select id="type">
          <option value="auto">Detect automatically</option>
          <option value="design">Design reference</option>
          <option value="tweet">Tweet</option>
          <option value="article">Article</option>
          <option value="video">Video</option>
        </select>
        <label for="note">Why keep it? <span>optional</span></label>
        <textarea id="note" rows="4" placeholder="What caught your attention?"></textarea>
        <p id="selectionHint" class="hint" hidden>Selected text will be saved with the page.</p>
        <p id="status" role="status"></p>
        <button type="submit">Save to Brain</button>
      </form>
      <button id="settings" class="link-button" type="button">Connection settings</button>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
