<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brain Clipper settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <span class="eyebrow">Brain Clipper</span>
      <h1>Connect your capture gateway</h1>
      <p class="lede">These details stay in Chrome’s local extension storage and are never synced through your Google account.</p>
      <form id="settingsForm">
        <label for="gatewayUrl">Gateway URL</label>
        <input id="gatewayUrl" type="url" placeholder="https://brain-gw.example.workers.dev" required />
        <label for="token">Capture token</label>
        <div class="token-row">
          <input id="token" type="password" autocomplete="off" required />
          <button id="paste" type="button" class="secondary">Paste</button>
        </div>
        <p class="help">Run <code>scripts/brain clipper-token</code>, then press Paste.</p>
        <p id="status" role="status"></p>
        <button type="submit">Test and save connection</button>
      </form>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
